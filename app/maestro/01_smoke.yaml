appId: com.augustone.timescavenger
---
- launchApp
- waitForAnimationToEnd
# 首启 onboarding 或已导入主屏，二者其一可见即 PASS
- assertVisible:
    id: "onboard_grant"
    optional: true
# 非 optional 硬断言：tab 栏存在 = 已过 onboarding 且无红屏挡层
- assertVisible: "照片"
- assertVisible:
    text: "轻触照片开始回顾.*"
    optional: true
